<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Web Code Editor &amp; Sandbox — CodePlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/lesson.css">
    <style>
        .editor-app {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 80px);
            padding: 15px 3%;
            max-width: 1600px;
            margin: 0 auto;
        }
        .ide-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .ide-tabs {
            display: flex;
            gap: 8px;
        }
        .ide-tab {
            padding: 8px 18px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ide-tab.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
        .ide-panes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex-grow: 1;
            min-height: 0;
        }
        .ide-editor-container {
            background: #0a0f1d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .ide-textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #f1f5f9;
            border: none;
            outline: none;
            padding: 18px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            tab-size: 2;
        }
        .ide-preview-container {
            background: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
        }
        .ide-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        @media (max-width: 900px) {
            .ide-panes {
                grid-template-columns: 1fr;
                height: auto;
            }
            .editor-app {
                height: auto;
            }
            .ide-editor-container, .ide-preview-container {
                min-height: 350px;
            }
        }
        .viewport-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0B1120;
            padding: 4px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .viewport-btn {
            background: transparent;
            border: none;
            color: #94A3B8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .viewport-btn.active {
            background: #4F46E5;
            color: #FFFFFF;
        }
        .auto-run-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: #CBD5E1;
            cursor: pointer;
            user-select: none;
            padding: 4px 8px;
            border-radius: 8px;
            background: #0B1120;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .auto-run-label input {
            cursor: pointer;
            accent-color: #4F46E5;
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="../index.html" class="logo" style="text-decoration:none;">
        &lt;/&gt; CodePlay
    </a>

    <nav class="nav">
        <a href="../index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="editor.html" style="color:#818cf8;font-weight:600;">Editor</a>
    </nav>
</header>

<div class="editor-app">
    <div class="ide-toolbar">
        <div class="ide-tabs">
            <button class="ide-tab active" onclick="switchTab('html')">🌐 HTML</button>
            <button class="ide-tab" onclick="switchTab('css')">🎨 CSS</button>
            <button class="ide-tab" onclick="switchTab('js')">⚡ JavaScript</button>
        </div>

        <div class="viewport-controls">
            <span style="font-size:0.75rem;color:#64748B;font-weight:600;padding-right:4px;">VIEWPORT:</span>
            <button type="button" class="viewport-btn active" id="vp-desktop" onclick="setViewport('desktop')">🖥️ Desktop</button>
            <button type="button" class="viewport-btn" id="vp-tablet" onclick="setViewport('tablet')">💻 Tablet (768px)</button>
            <button type="button" class="viewport-btn" id="vp-mobile" onclick="setViewport('mobile')">📱 Mobile (375px)</button>
        </div>

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <label class="auto-run-label">
                <input type="checkbox" id="auto-run-toggle" checked onchange="toggleAutoRun(this.checked)">
                <span>⚡ Auto-Run</span>
            </label>
            <button class="action-btn btn-copy" onclick="downloadProject()">💾 Export HTML</button>
            <button class="action-btn btn-reset" onclick="resetIde()">↺ Reset</button>
            <button class="action-btn btn-copy" onclick="copyCurrentCode()">📋 Copy</button>
            <button class="action-btn btn-run" onclick="compileIde()">▶ Run</button>
        </div>
    </div>

    <div class="ide-panes">
        <div class="ide-editor-container">
            <textarea id="ide-input" class="ide-textarea" spellcheck="false"></textarea>
        </div>

        <div class="ide-preview-container" id="ide-preview-wrapper" style="display:flex;justify-content:center;align-items:center;background:#060913;">
            <iframe id="ide-preview" class="ide-iframe" sandbox="allow-scripts" title="Preview Sandbox" style="transition:max-width 0.3s ease;"></iframe>
        </div>
    </div>
</div>

<div id="toast-msg" class="toast-msg">Copied!</div>

<script>
    const defaultCode = {
        html: `<!DOCTYPE html>
<html>
<head>
  <title>My CodePlay Project</title>
</head>
<body>
  <div class="hero">
    <h1>🚀 Welcome to CodePlay IDE</h1>
    <p>Build, test, and preview HTML, CSS & JavaScript in real time!</p>
    <button id="clickBtn">Click Me to Interact</button>
    <p id="msg"></p>
  </div>
</body>
</html>`,
        css: `body {
  margin: 0;
  padding: 30px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0b1120;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 80vh;
}

.hero {
  background: #111827;
  padding: 35px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  max-width: 450px;
}

h1 {
  color: #818cf8;
  font-size: 1.8rem;
  margin-top: 0;
}

button {
  background: #4f46e5;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  margin-top: 15px;
}

button:hover {
  background: #6366f1;
  transform: translateY(-2px);
}

#msg {
  color: #06b6d4;
  font-weight: bold;
  margin-top: 15px;
}`,
        js: `document.getElementById('clickBtn').addEventListener('click', () => {
  const msg = document.getElementById('msg');
  msg.textContent = '🎉 You are coding live in the CodePlay Sandbox!';
});`
    };

    let currentTab = 'html';
    const store = { ...defaultCode };
    const inputEl = document.getElementById('ide-input');
    const previewEl = document.getElementById('ide-preview');

    function switchTab(tab) {
        // Save current tab text
        store[currentTab] = inputEl.value;

        // Switch active tab styling
        document.querySelectorAll('.ide-tab').forEach((t, i) => {
            const tabs = ['html', 'css', 'js'];
            t.classList.toggle('active', tabs[i] === tab);
        });

        currentTab = tab;
        inputEl.value = store[tab];
    }

    function compileIde() {
        store[currentTab] = inputEl.value;

        const completeDoc = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    ${store.css}
  </style>
</head>
<body>
  ${store.html}
  <script>
    try {
      ${store.js}
    } catch (err) {
      console.error(err);
    }
  <\/script>
</body>
</html>
        `;

        previewEl.srcdoc = completeDoc;
    }

    function resetIde() {
        store.html = defaultCode.html;
        store.css = defaultCode.css;
        store.js = defaultCode.js;
        inputEl.value = store[currentTab];
        compileIde();
        showToast('↺ Workspace reset to default project');
    }

    function copyCurrentCode() {
        navigator.clipboard.writeText(inputEl.value);
        showToast('📋 Copied current tab code!');
    }

    function showToast(msg) {
        const t = document.getElementById('toast-msg');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Initialize
    inputEl.value = store.html;
    compileIde();

    // Export complete standalone HTML file
    function downloadProject() {
        store[currentTab] = inputEl.value;
        const completeDoc = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exported Project — CodePlay</title>
  <style>
${store.css}
  </style>
</head>
<body>
${store.html}
  <script>
    try {
${store.js}
    } catch (err) {
      console.error(err);
    }
  <\/script>
</body>
</html>`;
        const blob = new Blob([completeDoc], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'codeplay-project.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('💾 Downloaded codeplay-project.html!');
    }

    // Viewport switching (Desktop 100%, Tablet 768px, Mobile 375px)
    function setViewport(mode) {
        const preview = document.getElementById('ide-preview');
        const btnDesktop = document.getElementById('vp-desktop');
        const btnTablet = document.getElementById('vp-tablet');
        const btnMobile = document.getElementById('vp-mobile');

        [btnDesktop, btnTablet, btnMobile].forEach(b => b.classList.remove('active'));

        if (mode === 'mobile') {
            preview.style.maxWidth = '375px';
            btnMobile.classList.add('active');
            showToast('📱 Switched to Mobile View (375px)');
        } else if (mode === 'tablet') {
            preview.style.maxWidth = '768px';
            btnTablet.classList.add('active');
            showToast('💻 Switched to Tablet View (768px)');
        } else {
            preview.style.maxWidth = '100%';
            btnDesktop.classList.add('active');
            showToast('🖥️ Switched to Full Desktop View');
        }
    }

    // Auto-Run live compiling
    let isAutoRun = true;
    let debounceTimer = null;
    function toggleAutoRun(enabled) {
        isAutoRun = enabled;
        showToast(isAutoRun ? '⚡ Auto-Run Enabled' : '⏸️ Auto-Run Disabled (Manual Run Only)');
    }

    inputEl.addEventListener('input', () => {
        if (!isAutoRun) return;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            compileIde();
        }, 350);
    });

    // Tab key support
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = inputEl.selectionStart;
            const end = inputEl.selectionEnd;
            inputEl.value = inputEl.value.substring(0, start) + '  ' + inputEl.value.substring(end);
            inputEl.selectionStart = inputEl.selectionEnd = start + 2;
            if (isAutoRun) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => compileIde(), 350);
            }
        }
    });
</script>

</body>
</html>
